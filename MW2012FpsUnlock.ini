[FpsUnlock]
; Frame rate cap: how many frames per second the game renders, in any display
; mode. 0 = no cap (default). Any other value caps it at that many (minimum
; 30). The simulation always runs at its fixed 60 Hz either way, so game speed
; is never affected.
TargetFPS=0

; Start and loading screens at 60 fps. Without a cap they render at thousands
; of frames per second, which only heats the graphics card.
; 1 = on (default), 0 = off.
LoadingScreenCap=1

; Display mode.
; 1 = borderless window covering the screen (default). The screen keeps the
;     resolution and refresh rate Windows uses, Alt+Tab is instant, and it
;     never goes black when switching in or out of the game.
; 0 = the game's own exclusive fullscreen (Alt+Enter), at the refresh rate
;     below instead of the 60 Hz the game would pick.
Borderless=1

; Monitor refresh rate in exclusive fullscreen, in Hz (the game itself would
; pick 60). 0 = the same as the Windows desktop (default). Any other value
; picks the closest rate the monitor supports. In borderless mode the monitor
; runs at whatever Windows is set to, so this has no effect there; to limit
; rendered frames use TargetFPS.
RefreshRate=0

; Vsync override.
; -1 = leave the game's own setting untouched (default)
;  0 = vsync off
;  1 = vsync on
VsyncInterval=-1

; Log file MW2012FpsUnlock.log, written next to this file (or to %TEMP% if
; this folder is not writable). Please attach it when reporting a problem.
; 0 = off, 1 = normal (default), 2 = verbose (adds periodic statistics).
LogLevel=1
